kind = "web"
previewPath = "/"
title = "Onyx FX"
description = "The imported Onyx FX trading dashboard, with performance monitoring, trading controls, strategy settings, logs and the original AegisQuant terminal."
version = "1.0.0"
id = "artifacts/onyx-fx"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19093

[services.development]
run = "pnpm --filter @workspace/onyx-fx run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/onyx-fx", "run", "build" ]
serve = "static"
publicDir = "artifacts/onyx-fx/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19093"
BASE_PATH = "/"
