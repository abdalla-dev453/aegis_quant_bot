name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"

      - name: Lint Backend
        run: ruff check apps/api/app/

      - name: Typecheck Backend (Strict)
        run: mypy apps/api/app/

      - name: Run Backend Unit & Security Tests
        run: PYTHONPATH=apps/api pytest apps/api/tests/

      - name: Validate Contract Types & Assertions
        run: node --experimental-strip-types packages/contracts/src/index.test.ts

      - name: Generate OpenAPI Spec & Validate Drift
        run: |
          PYTHONPATH=apps/api python apps/api/app/openapi.py
          git diff --exit-code packages/contracts/openapi.json
